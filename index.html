:root{--bg:#101014;--surface:#181b23;--line:#30303a;--accent:#f97316;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:16px system-ui}header,main{max-width:900px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:27px;margin:0}h1 span{color:var(--accent)}h2{font-size:22px}small,p{color:#aaaab5}button,input,textarea,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}button{cursor:pointer}button.primary,nav button.active{background:var(--accent);color:#111;font-weight:700}input,textarea,select{width:100%}textarea{min-height:130px;resize:vertical}main{padding-bottom:110px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.card h3{margin:12px 0;font-size:17px}.card button{width:100%;text-align:left}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:5px;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}nav button{width:min(24%,180px);border:0;font-size:13px}nav b{display:block;font-size:22px}label{display:block;margin:14px 0 6px}pre{white-space:pre-wrap;font:inherit;line-height:1.7}img{max-width:100%;border-radius:10px} .note{font-size:13px;color:#d6a16e}.swatch{width:32px;height:32px;border-radius:50%;padding:0;flex:none}a{color:var(--accent)}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:center}.palette .swatch{width:100%;max-width:48px;aspect-ratio:1;height:auto;justify-self:center;border:2px solid transparent}.palette .swatch[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:3px;border-color:var(--bg)}.custom-color{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.custom-color input{width:52px;height:40px;padding:4px;cursor:pointer}.card h3,main h2{overflow-wrap:anywhere}main h2{border-left:3px solid var(--accent);padding-left:10px}.card small,.card button,header button{color:var(--accent)}.card button{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}nav button.active{background:transparent;color:var(--accent)}nav button.active b{color:var(--accent)}input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}input[type=checkbox]{accent-color:var(--accent)}button.primary{color:#111}button:focus-visible{outline:2px solid var(--accent)}@media(max-width:380px){.palette{gap:8px}nav button{padding:8px 2px;font-size:11px}}</style><header><h1>SAUCE<span>.</span></h1><div><button id="installApp" hidden onclick="installApp()">Telepítés</button> <button onclick="edit()">＋ Recept</button></div></header><main id="main"></main><nav id="nav"><button onclick="show('all')"><b>⌂</b>Receptek</button><button onclick="show('fav')"><b>♡</b>Kedvencek</button><button onclick="edit()"><b>＋</b>Új recept</button><button onclick="show('settings')"><b>⚙</b>Beállítások</button></nav><script>const defaults=[{"id": "0", "title": "Mogyorós sütemény", "ingredients": "15 dkg liszt\n4 dkg mogyoró\n5 dkg cukor\n½ csomag vaníliás cukor\n10 dkg hideg vaj\n1 tojás sárgája\n5 dkg meggyzselé", "steps": "A száraz hozzávalókat összekeverjük, hozzáadjuk a vajat és a tojássárgáját. 1 órára hűtőben pihentetjük. 2 cm-es golyókat formázunk, közepükbe mélyedést készítünk, meggyzselével töltjük.", "category": "Sütemény", "favorite": false}, {"id": "1", "title": "Hókifli", "ingredients": "50 dkg liszt\n15 dkg porcukor\n40 dkg vaj\n1 cs vaníliás cukor\n20 dkg darált dió", "steps": "Összegyúrjuk, megsodorjuk mint a nudlit, kiflit formálunk, megsütjük.", "category": "Sütemény", "favorite": false}, {"id": "2", "title": "Meggyes pite", "ingredients": "40–45 dkg liszt\n½ cs sütőpor\n2 tojás sárgája\n2 ek cukor\nsó\n25 dkg Rama\n1 pohár tejföl\n1 kg meggy\n1 vaníliapuding\n4 dl meggylé", "steps": "Összegyúrjuk közepes keménységű tésztává. A pudingot meggylével és cukorral készítjük, belekeverjük a meggyet. A kinyújtott tésztát zsemlemorzsával megszórjuk, rá a zselét. Tojásfehérjével megkenjük.", "category": "Sütemény", "favorite": false}, {"id": "3", "title": "Linzer", "ingredients": "3 rész liszt\n1 rész cukor\n2 rész margarin\n1 tojás lehet bele", "steps": "Az elkészítés nincs részletezve.", "category": "Sütemény", "favorite": false}, {"id": "4", "title": "Almás marcipános", "ingredients": "15 dkg liszt\n25 dkg vaj\n15 dkg cukor\n1 tojássárgája\n10 dkg marcipán\n4–5 közepes alma", "steps": "A lisztet összegyúrjuk a vajjal, cukorral és tojássárgájával. Formába tesszük. A marcipánt vékonyra nyújtjuk, ráhelyezzük. Az almát gerezdekre vágjuk. 180 °C, 50 perc. Sütés után lekvárral megkenjük.", "category": "Sütemény", "favorite": false}, {"id": "5", "title": "Gofri", "ingredients": "3 tojás\n2 tk sütőpor\n8 ek olaj\n4 dl tej\n3 tk cukor\n½ tk só\n25 dkg liszt", "steps": "A tojássárgáját összekeverjük a tejjel, liszttel, sütőporral, cukorral, sóval és olajjal. A fehérjét kemény habbá verjük és beleforgatjuk.", "category": "Sütemény", "favorite": false}, {"id": "6", "title": "Sajtos rúd", "ingredients": "1 kg liszt\n20 dkg margarin\n15 dkg zsír\n20 dkg reszelt sajt\n1 nagy tejföl\n2 tojássárgája\n1 cs szalalkáli\nsó", "steps": "Vékonyra, kb. fél centisre kinyújtjuk, reszelt sajttal megszórjuk, csíkokra vágjuk, megsütjük.", "category": "Sós", "favorite": false}, {"id": "7", "title": "Dupla csokis süti", "ingredients": "125 g étcsoki\n12 dkg vaj\n5 dkg cukor\n7 dkg barna cukor\n15 dkg liszt\n3 dkg kakaó\n1 tk szódabikarbóna\n1 tojás\ncsipet só\ncsokipasztilla", "steps": "Az elkészítés nincs részletezve.", "category": "Sütemény", "favorite": false}, {"id": "8", "title": "Lusta lángos", "ingredients": "1 kg liszt\n5 dl tej\n5 dkg élesztő\n2 dl tejföl\n1 ek só\npici cukor\nolaj a sütéshez", "steps": "Cukros tejben felfuttatjuk az élesztőt, a többi hozzávalóval összegyúrjuk. Lisztezett deszkára kiszaggatjuk, kb. 15–20 percig kelesztjük. Forró olajban kisütjük.", "category": "Sós", "favorite": false}, {"id": "9", "title": "Kifordított ananászos", "ingredients": "3 tojás\n15 dkg cukor\n1 cs vaníliás cukor\n15 dkg liszt\nfél tk sütőpor\n20 dkg vaj\n15 dkg barna cukor\n1 konzerv ananász", "steps": "A tojásokat a cukorral és vaníliás cukorral habosra keverjük. Hozzászitáljuk a lisztet és sütőport. A vajat megolvasztjuk és belekeverjük. A formát sütőpapírral béleljük, megszórjuk barna cukorral, ráhelyezzük az ananászt és ráöntjük a tésztát. Kb. 40 perc sütés.", "category": "Sütemény", "favorite": false}, {"id": "10", "title": "Kelt bukta", "ingredients": "Finomliszt (mennyiség hiányzik)\nRétesliszt (mennyiség hiányzik)\n2 cs só [ellenőrizendő]\n6 ek cukor\n3,5 dl tej\nfél élesztő\n1 dl olaj\n1 tojás", "steps": "Az élesztőt kb. 1 dl tejben felfuttatjuk. A hozzávalókat összekeverjük, összegyúrjuk. Első kelés után átdagasztjuk. Kinyújtjuk, lekvárral megtöltjük, olajozott tepsibe tesszük.", "category": "Sütemény", "favorite": false}, {"id": "11", "title": "Aranygaluska", "ingredients": "50 dkg liszt\n20 dkg margarin\n10 dkg dió\n10 dkg cukor\n2,5–3 dl tej\n1 tojássárgája\n2 dkg élesztő\nsó\n1 l tej és 1 vaníliapuding (öntet)", "steps": "Az élesztőt felfuttatjuk. Lágy tésztát készítünk 5 dkg margarinnal. Duplára kelesztjük. A maradék margarint felolvasztjuk, a diót cukorral összekeverjük. Galuskákat szaggatunk, rétegezzük. 35–40 percig sütjük.", "category": "Sütemény", "favorite": false}, {"id": "12", "title": "Sajtos-túrós rúd", "ingredients": "50 dkg liszt\n50 dkg túró\n25 dkg Rama\nsó\nélesztő\ntejföl\n1 dl tej\nsajt a tetejére", "steps": "Fóliában hűtőben 1 napig pihentetjük.", "category": "Sós", "favorite": false}, {"id": "13", "title": "Krumplis pogácsa", "ingredients": "25 dkg Rama\n1 tejföl\n½ élesztő, tej és cukor\n2 tk só\n2 púpos ek zsír\n2 öklömnyi krumpli\nkb. 50 dkg liszt\n2 tojássárgája\n10 dkg túró (opcionális)", "steps": "Meggyúrni, nyújtás előtt egyszer meghajtani. Ujjnyi vastagra nyújtani, tetejére sajt vagy magvak, só. Sütőbe vizet kell rakni.", "category": "Sós", "favorite": false}, {"id": "14", "title": "Diós kekszes szelet", "ingredients": "6 tojásfehérje\n20 dkg cukor\n15 dkg darált dió\n2 dkg zsemlemorzsa\n3 dkg liszt\n1 tk sütőpor\n1 cs háztartási keksz\n1 cs vaníliás cukor\n2 dl tej\nKrém: 6 tojássárgája, 2 vaníliapuding, 25 dkg cukor, 7,5 dl tej, 25 dkg Rama", "steps": "A tojásfehérjét felverjük, a többi alapanyagot óvatosan hozzákeverjük. A krémhez a tejet pudinggal, cukorral és tojássárgájával főzzük. A további rétegezést az eredeti fotón ellenőrizd.", "category": "Sütemény", "favorite": false}, {"id": "15", "title": "Kókuszkocka", "ingredients": "20 dkg cukor\n5 dkg Rama\n1 egész tojás\n2 ek méz\n30 dkg liszt\n1 sütőpor\n2 dl langyos tej\nMáz: 20 dkg margarin, 6 ek cukor, 3 ek kakaó, 6 ek tej", "steps": "A cukrot, Ramát és tojást habosra keverjük. Hozzáadjuk a többi hozzávalót. A mázat összefőzzük.", "category": "Sütemény", "favorite": false}, {"id": "16", "title": "Citromkrém torta", "ingredients": "2 dl tej\n2 dkg liszt\n10 dkg cukor\nfél citrom héja és leve\n15 dkg vaj\n6 tojásból piskóta", "steps": "A tejből és lisztből sűrű besamelt főzünk. A tűzről levéve hozzáadjuk a cukrot, citromhéjat és citromlevet. Ha kihűlt, a habosra kevert vajat belekeverjük. A piskótát 3 lapra vágjuk.", "category": "Sütemény", "favorite": false}, {"id": "17", "title": "Palacsinta / piskóta (cím bizonytalan)", "ingredients": "8 tojás\n10 dkg nyírfacukor\n1 késhegynyi sütőpor\n20 dkg darált mandula\n2 dl víz\n5 ek kókuszpor [ellenőrizendő]\n10 dkg nyírfacukor\n15 dkg vaj", "steps": "A fotón csak a hozzávalók olvashatók részben.", "category": "Sütemény", "favorite": false}, {"id": "family-1314-18", "title": "Apró kifli", "ingredients": "50 dkg liszt\n45 dkg vaj\n2,4 dl tejföl\n4 tojássárgája\nporcukor\nlekvár vagy dió vagy mák", "steps": "A lisztet a vajjal elmorzsoljuk. A tejfölt a tojássárgájával elkeverjük, összegyúrjuk. 16 egyforma gombócra osztjuk, 1 napra hűtőbe tesszük. Egyenként 30 cm átmérőjűre nyújtjuk porcukrozott deszkán. Töltjük, feltekerjük. 190 °C, 20–25 perc.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1314-19", "title": "Bögrés tészta", "ingredients": "1 tojás\n1 bögre cukor\n1 bögre tej\n1 bögre dió\n1 bögre rétesliszt\n1 sütőpor\n1 citrom reszelt héja", "steps": "A tojást a cukorral és sütőporral habosra verjük, hozzáadjuk az apróra vágott diót, citromhéjat, tejet és lisztet.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1313-20", "title": "Csokoládés túrórúd", "ingredients": "50 dkg túró\n15 dkg vaj\n8 dkg porcukor\n1 cs vaníliás cukor\n30 dkg csoki (tortabevonó)", "steps": "A túrót áttörjük, hozzáadjuk a cukorral habosra kevert vajat és a vaníliás cukrot. Vékony hengereket formálunk a lehűtött túróból, csokiba mártjuk, lehűtjük.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1313-21", "title": "Sport szelet", "ingredients": "50 dkg darált keksz\n3 ek kakaó\n25 dkg olvasztott Rama\n2 dl langyos tej\n25 dkg cukor\nrumaroma\n2 ek olaj\n10 dkg étcsoki", "steps": "Az elkészítés nincs leírva a füzetben.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1312-22", "title": "Rizses csoki", "ingredients": "40 dkg cukor\n1,5 dl víz\n2 cs vaníliás cukor\n15 dkg margarin\n2 cs tejpor\n2 cs rizs\n5 dkg kakaó", "steps": "A cukorból, vízből és vaníliás cukorból szirupot főzünk. A tepsit kivajazzuk, a rizst a tetejére szórjuk. A további lépések nincsenek részletezve.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1312-23", "title": "Mézes zserbó", "ingredients": "45 dkg liszt\n15 dkg cukor\n1 kk szódabikarbóna\n3 dkg zsír\n3 ek langyos méz\n1 tojás\n3 ek tej\nTöltelék: 2 dl tej\n2 ek liszt\n15 dkg vaj\n20 dkg cukor\nreszelt citromhéj", "steps": "Összedolgozzuk, 4 lapot sütünk. A tejet és lisztet simára főzzük, kihűtve vajjal és cukorral keverjük, hozzáadjuk a citromhéjat.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1311-24", "title": "Őszibarack", "ingredients": "75 dkg liszt\n25 dkg margarin\n2 tojássárgája\n25 dkg porcukor\n1 dl tej\n1 sütőpor\nTöltelék: 2 dl tej\n15 dkg cukor\n20 dkg margarin\n1 dl rum\n15 dkg darált dió", "steps": "A tészta hozzávalóit összegyúrjuk. Kb. 55 barack. A további elkészítés nincs leírva.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1311-25", "title": "Sajtos ropi", "ingredients": "50 dkg liszt\n25 dkg Rama\n1 sütőpor\n1 tojás\n15 dkg sajt\nsó\nkömény\ntej", "steps": "Az elkészítés nincs leírva a füzetben.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sós", "favorite": false}, {"id": "family-1310-26", "title": "Kuglóf", "ingredients": "4 tojás\n12 dkg margarin\n25 dkg cukor\n30 dkg liszt\n1 sütőpor\n1 vaníliás cukor\n2 dl tej\nkevéske kakaó", "steps": "A margarint és cukrot a tojássárgájával habosra keverjük. A további lépések nincsenek részletezve.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1310-27", "title": "Amerikai palacsinta", "ingredients": "20 dkg liszt\n1 cs sütőpor\n1 csipet só\n1 ek cukor\n3 dl tej\n1 tojás\n5 dkg vaj", "steps": "Az elkészítés nincs leírva a füzetben.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1309-28", "title": "Csokis keksz", "ingredients": "15 dkg liszt\n15 dkg cukor\n15 dkg csoki\n1 vaníliás cukor\n15 dkg vaj\n1 sütőpor\n1 tojás\ndió", "steps": "Az elkészítés nincs leírva a füzetben.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1309-29", "title": "Márvány piskóta", "ingredients": "4 tojás\n30 dkg porcukor\n1 csomag margarin (jelölés bizonytalan)\n2 db vaníliás cukor\n30 dkg liszt\n1 sütőpor\n1 tejföl\n2 ek kakaópor\ndió", "steps": "Az első négy hozzávalót kikeverjük, hozzáadjuk a lisztet, sütőport és tejfölt. Felét tepsibe öntjük, másik feléhez kakaóport adunk. Diót szórunk rá.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1308-30", "title": "Csenge mama kalácsa (cím bizonytalan)", "ingredients": "½ l tej\n10 dkg margarin\n5 dkg élesztő\n1 tojás\nsó\n80 dkg liszt\ncukor (mennyiség bizonytalan)", "steps": "Kevés tej, élesztő és cukor. A jegyzet langyos tejet, lisztet, cukrot, margarint, tojást és sót említ; a liszt mennyisége a leírásban 70 dkg-ként is szerepel.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1307-31", "title": "Sós kifli", "ingredients": "2 tojás\n1 dl olaj\n1 nagy joghurt\n2,5 dl tej\n5 dkg élesztő (felfuttatva)\n1 kg liszt\n1 margarin\n1 ek só\nszezámmag vagy kömény", "steps": "Gyúrás után 8 egyenlő részre osztjuk, cipókat gyúrunk. Megnyújtva kerekre, a tetejét margarin és só keverékével megkenjük. 8 részre vágjuk és feltekerjük.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sós", "favorite": false}, {"id": "family-1306-32", "title": "Pozsonyi kifli", "ingredients": "1 kg liszt\n20 dkg vaj\n15 dkg zsír\n60 dkg cukor + 8 dkg (ellenőrizendő)\n1 dkg élesztő\n2 tojás (1 a tésztába)\n2 dl tej\n1 csipet só\n40 dkg dió\n1 csipet fahéj\n½ citrom\n22 dkg cukor\n2 dl víz", "steps": "A cukorból és vízből szirupot készítünk, fahéjjal és citromhéjjal a dióra öntjük. A tészta elkészítése nincs részletezve; a cukor mennyiségét ellenőrizni kell.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1305-33", "title": "Kakaós szelet", "ingredients": "3 tojás\n20 dkg cukor\n20 dkg liszt\n5 dkg vaj\n1 dkg kakaó\n2 dl kávé\n1 cs sütőpor\nrum\nvaníliás cukor", "steps": "A tojássárgáját habosra keverjük a cukorral és vajjal, hozzáadjuk a kávét, lisztet, sütőport, majd a tojásfehérje habját.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1305-34", "title": "Morzsás süti", "ingredients": "10 dkg vaj\n10 dkg cukor\n15 dkg liszt\nvaj a kenéshez", "steps": "Az elkészítés nincs leírva a füzetben.\n\nKéziratos recept: az átírást ellenőrizendő.", "category": "Sütemény", "favorite": false}, {"id": "family-1304-35", "title": "Túrógombóc", "ingredients": "50 dkg túró\n2 db tojás\n2 ek porcukor\n7–8 dkg búzadara\nPici só\n1 citrom héja", "steps": "Miután a gombócok feljöttek a víz felszínére, még 2–3 percig főzzük. A további elkészítési lépések nincsenek leírva a füzetben.", "category": "Desszert", "favorite": false}];</script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;try{data=JSON.parse(localStorage.savourRecipes)}catch{}if(!Array.isArray(data))data=structuredClone(defaults);try{if(!localStorage.sauceFamilyV2){for(const r of defaults.filter(r=>r.id.startsWith('family-'))){if(!data.some(x=>x.id===r.id))data.push(structuredClone(r))}localStorage.savourRecipes=JSON.stringify(data);localStorage.sauceFamilyV2='1'}}catch{}let page='all';function save(){localStorage.savourRecipes=JSON.stringify(data)}function show(p){page=p;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===({all:0,fav:1,settings:3}[p]))); if(p==='settings'){ $('main').innerHTML='<h2>Megjelenés</h2><div class="card"><div class="palette">'+['#f97316','#9065ff','#e5484d','#3b82f6','#22c55e','#ec4899'].map(c=>`<button class="swatch" style="background:${c}" onclick="color('${c}')" aria-label="${c}" aria-pressed="${c===(localStorage.savourColor||'#f97316')}"></button>`).join('')+'<label class="custom-color">Egyéni szín <input type="color" value="'+(localStorage.savourColor||'#f97316')+'" oninput="color(this.value)" aria-label="Egyéni szín"></label></div></div><h2>Adatok</h2><button onclick="backup()">Mentés exportálása</button> <button onclick="document.getElementById(\'restore\').click()">Importálás</button><input hidden type="file" id="restore" accept=".json" onchange="restore(this)">';return} $('main').innerHTML=`<h2>${p==='fav'?'Kedvencek':'Receptkönyv'}</h2><p>${data.length} recept · Saját gyűjtemény</p><input id="search" placeholder="Recept keresése…" oninput="cards()"><div class="row" style="margin:12px 0"><select id="cat" onchange="cards()"><option value="">Minden kategória</option>${[...new Set(data.map(r=>r.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="grid" id="cards"></div>`;cards()}
function cards(){let q=$('search').value.toLowerCase(),c=$('cat').value; $('cards').innerHTML=data.filter(r=>(page!=='fav'||r.favorite)&&(!c||r.category===c)&&(r.title+' '+r.ingredients).toLowerCase().includes(q)).map(r=>`<article class="card"><small>${esc(r.category)} ${r.favorite?'♥':''}</small><h3>${esc(r.title)}</h3><button data-id="${esc(r.id)}" onclick="detail(this.dataset.id)">Megnyitás →</button></article>`).join('')||'<p>Nincs találat.</p>'}
function detail(id){let r=data.find(x=>x.id===id);if(!r)return;$('main').innerHTML=`<button onclick="show(page)">‹ Vissza</button><h2>${esc(r.title)}</h2><div class="row"><button onclick="toggle('${id}')">${r.favorite?'♥':'♡'} Kedvenc</button><button onclick="edit('${id}')">Szerkesztés</button></div>${r.source?'<p class="note">Kéziratos átirat – ellenőrizd az eredeti fotót, különösen a bizonytalan mennyiségeket.</p>':''}<h2>Hozzávalók</h2><div class="card">${r.ingredients.split('\n').filter(Boolean).map(s=>`<label><input style="width:auto" type="checkbox"> ${esc(s)}</label>`).join('')}</div><h2>Elkészítés</h2><div class="card"><pre>${esc(r.steps)}</pre></div>${r.source?`<details><summary>Eredeti kézirat</summary><img src="${esc(r.source)}" alt="Eredeti recept"></details>`:''}<p><button onclick="removeRecipe('${id}')">Törlés</button></p>`}function toggle(id){let r=data.find(x=>x.id===id);r.favorite=!r.favorite;save();detail(id)}function removeRecipe(id){if(confirm('Törlöd a receptet?')){data=data.filter(x=>x.id!==id);save();show('all')}}
function edit(id){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===2));let r=data.find(x=>x.id===id)||{};$('main').innerHTML=`<h2>${id?'Szerkesztés':'Új recept'}</h2><label>Recept beillesztése</label><textarea id="paste" placeholder="Másold ide a teljes receptet…"></textarea><button onclick="parsePaste()">Szöveg feldolgozása</button><label>Név</label><input id="title" value="${esc(r.title)}"><label>Kategória</label><input id="category" value="${esc(r.category||'Egyéb')}"><label>Hozzávalók (soronként)</label><textarea id="ingredients">${esc(r.ingredients)}</textarea><label>Elkészítés</label><textarea id="steps">${esc(r.steps)}</textarea><div class="row"><button class="primary" onclick="store('${id||''}')">Mentés</button><button onclick="show('all')">Mégse</button></div>`}function parsePaste(){let lines=$('paste').value.trim().split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;$('title').value=lines.shift();let a=[],b=[],mode='a';for(let l of lines){if(/^(hozzávalók|ingredients)\s*:?$/i.test(l)){mode='a';continue}if(/^(elkészítés|instructions|directions|method|preparation)\s*:?$/i.test(l)){mode='b';continue}if(mode==='a'&&/^(\d+[.)]\s+|melegíts|keverd|preheat|mix\b)/i.test(l))mode='b';(mode==='a'?a:b).push(l)}$('ingredients').value=a.join('\n');$('steps').value=b.join('\n')}function store(id){let title=$('title').value.trim();if(!title)return alert('Adj meg nevet!');let r=data.find(x=>x.id===id)||{id:crypto.randomUUID(),favorite:false};Object.assign(r,{title,category:$('category').value.trim()||'Egyéb',ingredients:$('ingredients').value,steps:$('steps').value});if(!id)data.push(r);save();detail(r.id)}function color(c){document.documentElement.style.setProperty('--accent',c);localStorage.savourColor=c;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-label')===c)));const picker=document.querySelector('.custom-color input');if(picker)picker.value=c}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='sauce-recipes.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},30000)}async function restore(i){try{let x=JSON.parse(await i.files[0].text());if(!Array.isArray(x)||!x.every(r=>typeof r.title==='string'&&typeof r.ingredients==='string'&&typeof r.steps==='string'))throw Error();if(confirm('A jelenlegi gyűjtemény cseréje?')){data=x.map(r=>({...r,id:crypto.randomUUID()}));save();show('all')}}catch{alert('Érvénytelen fájl')}}if(/^#[0-9a-f]{6}$/i.test(localStorage.savourColor||''))color(localStorage.savourColor);show('all');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.error);let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installApp').hidden=false});window.addEventListener('appinstalled',()=>{installPrompt=null;document.getElementById('installApp').hidden=true});async function installApp(){if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installApp').hidden=true}</script></html>
